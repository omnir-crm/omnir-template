services:
  vtiger:
    build: .
    container_name: omnir_crm_app
    restart: unless-stopped
    ports:
      - "${VT_PORT:-8080}:80"
    environment:
      - VT_DB_HOST=db
      - VT_DB_NAME=${MYSQL_DATABASE}
      - VT_DB_USER=${MYSQL_USER}
      - VT_DB_PASSWORD=${MYSQL_PASSWORD}
      - VT_SITE_URL=${VT_SITE_URL:-http://localhost:8080/}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: mysql:5.7
    container_name: omnir_crm_db
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode="ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./db-data:/var/lib/mysql
      - ./vtiger_base_setup_utf8.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
